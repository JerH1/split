<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <title>Split</title>
    <meta
      name="description"
      content="Snap a receipt, share a code, and split the bill in real time."
    />

    <!-- The whole flow is a phone at a restaurant table, so the bill link is
         mostly opened from a message thread. These decide what that thread
         shows instead of a bare URL. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Split — split the bill" />
    <meta
      property="og:description"
      content="Snap a receipt, share a code, and split the bill in real time."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <!-- Installability: add-to-home-screen matters for something used standing
         up, one-handed, with the check already on the table. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Split" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
